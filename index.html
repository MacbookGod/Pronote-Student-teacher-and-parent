<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PRONOTE Desktop Launcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 460px;
      box-sizing: border-box;
    }
    h2, h3 { 
      margin-top: 0;
      margin-bottom: 20px; 
      color: #333; 
      text-align: center;
    }
    h3 {
      font-size: 15px;
      border-top: 1px solid #e5e5ea;
      padding-top: 15px;
      margin-top: 25px;
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: #0071e3;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }
    button:hover { 
      background-color: #0077ed; 
    }
    .account-list {
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }
    .account-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .account-info {
      text-align: left;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }
    .account-info strong {
      color: #1d1d1f;
      display: block;
    }
    .account-info span {
      font-size: 11px;
      color: #86868b;
    }
    .actions-btn {
      display: flex;
      gap: 6px;
    }
    .btn-connect {
      background-color: #34c759;
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
    }
    .btn-connect:hover { background-color: #30b651; }
    .btn-delete {
      background-color: #ff3b30;
      padding: 6px 10px;
      font-size: 12px;
      width: auto;
    }
    .btn-delete:hover { background-color: #e03229; }
    .no-accounts {
      font-size: 13px;
      color: #86868b;
      font-style: italic;
      margin: 15px 0;
      text-align: center;
    }
    .footer-note {
      font-size: 11px;
      color: #aeaeae;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>PRONOTE Profiles V2.0</h2>
    
    <div class="account-list" id="accountList"></div>
    
    <h3>Add Profile Context Slot</h3>
    
    <label for="profileNameInput">Profile Label</label>
    <input type="text" id="profileNameInput" placeholder="e.g. Lycée Enfant 1">

    <label for="urlInput">PRONOTE / ENT Landing Link</label>
    <input type="url" id="urlInput" placeholder="https://...">
    
    <label for="usernameInput">Authentication Username</label>
    <input type="text" id="usernameInput" placeholder="Login ID">
    
    <label for="passwordInput">Authentication Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••">
    
    <button onclick="saveAndConnect()">Save and Launch</button>
    <div class="footer-note">Press Cmd+R / Ctrl+R inside web views to jump back here.</div>
  </div>

  <script>
    const profileNameInput = document.getElementById('profileNameInput');
    const urlInput = document.getElementById('urlInput');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const accountListContainer = document.getElementById('accountList');

    let accounts = [];

    // Safe profile asynchronous ingestion loop
    async function loadAccounts() {
      if (window.electronAPI && window.electronAPI.getAccounts) {
        accounts = await window.electronAPI.getAccounts();
        renderAccounts();
      }
    }

    function renderAccounts() {
      accountListContainer.innerHTML = '';
      if (!accounts || accounts.length === 0) {
        accountListContainer.innerHTML = '<div class="no-accounts">No saved accounts profiles.</div>';
        return;
      }

      accounts.forEach((acc, index) => {
        const item = document.createElement('div');
        item.className = 'account-item';
        
        const info = document.createElement('div');
        info.className = 'account-info';
        info.innerHTML = `<strong>${acc.name}</strong><span>User: ${acc.username || 'None'}</span>`;
        
        const actions = document.createElement('div');
        actions.className = 'actions-btn';
        
        const connectBtn = document.createElement('button');
        connectBtn.className = 'btn-connect';
        connectBtn.innerText = 'Launch';
        connectBtn.onclick = () => launchAccount(index);
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.innerText = '✕';
        deleteBtn.onclick = () => deleteAccount(index);
        
        actions.appendChild(connectBtn);
        actions.appendChild(deleteBtn);
        item.appendChild(info);
        item.appendChild(actions);
        accountListContainer.appendChild(item);
      });
    }

    function launchAccount(index) {
      const acc = accounts[index];
      if (window.electronAPI && window.electronAPI.sendUrl) {
        window.electronAPI.sendUrl({
          url: acc.url,
          username: acc.username,
          password: acc.password
        });
      }
    }

    function saveAndConnect() {
      let name = profileNameInput.value.trim();
      let url = urlInput.value.trim();
      let username = usernameInput.value.trim();
      let password = passwordInput.value;

      if (!url) return;
      if (!name) name = "Profile " + (accounts.length + 1);
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const newAccount = { name, url, username, password };
      accounts.push(newAccount);
      
      if (window.electronAPI && window.electronAPI.saveAccounts) {
        window.electronAPI.saveAccounts(accounts);
      }
      
      profileNameInput.value = '';
      urlInput.value = '';
      usernameInput.value = '';
      passwordInput.value = '';
      
      renderAccounts();
      
      if (window.electronAPI && window.electronAPI.sendUrl) {
        window.electronAPI.sendUrl(newAccount);
      }
    }

    function deleteAccount(index) {
      accounts.splice(index, 1);
      if (window.electronAPI && window.electronAPI.saveAccounts) {
        window.electronAPI.saveAccounts(accounts);
      }
      renderAccounts();
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'r') {
        if (window.electronAPI && window.electronAPI.resetApp) {
          window.electronAPI.resetApp();
        }
      }
    });

    loadAccounts();
  </script>
</body>
</html>
