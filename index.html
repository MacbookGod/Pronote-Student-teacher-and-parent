<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PRONOTE Desktop Launcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 400px;
    }
    h2 { 
      margin-top: 0;
      margin-bottom: 20px; 
      color: #333; 
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .checkbox-container input {
      width: auto;
      margin: 0 8px 0 0;
    }
    .checkbox-container span {
      font-size: 13px;
      color: #444;
    }
    button {
      background-color: #0071e3;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }
    button:hover { 
      background-color: #0077ed; 
    }
    .info {
      font-size: 11px;
      color: #999;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>PRONOTE Setup</h2>
    
    <label for="urlInput">PRONOTE / ENT URL</label>
    <input type="url" id="urlInput" placeholder="https://index-education.net" required>
    
    <label for="usernameInput">ENT Username</label>
    <input type="text" id="usernameInput" placeholder="john.doe">
    
    <label for="passwordInput">ENT Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••">

    <label class="checkbox-container">
      <input type="checkbox" id="autoLaunchInput">
      <span>Auto-connect on app launch</span>
    </label>
    
    <button onclick="submitUrl()">Connect & Save</button>
    <div class="info">Press Ctrl+R / Cmd+R anytime to clear configuration view.</div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const autoLaunchInput = document.getElementById('autoLaunchInput');

    const savedUrl = localStorage.getItem('pronote-url');
    const savedUser = localStorage.getItem('pronote-user');
    const savedPass = localStorage.getItem('pronote-pass');
    const autoLaunch = localStorage.getItem('pronote-autolaunch') === 'true';

    if (savedUrl) urlInput.value = savedUrl;
    if (savedUser) usernameInput.value = savedUser;
    if (savedPass) passwordInput.value = savedPass;
    if (autoLaunch) autoLaunchInput.checked = true;

    // Direct auto-execution loop on app start
    if (savedUrl && autoLaunch && window.electronAPI && window.electronAPI.sendUrl) {
      window.electronAPI.sendUrl({
        url: savedUrl,
        username: savedUser || '',
        password: savedPass || ''
      });
    }

    function submitUrl() {
      let url = urlInput.value.trim();
      if (!url) return;
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      
      localStorage.setItem('pronote-url', url);
      localStorage.setItem('pronote-user', usernameInput.value.trim());
      localStorage.setItem('pronote-pass', passwordInput.value);
      localStorage.setItem('pronote-autolaunch', autoLaunchInput.checked);
      
      if (window.electronAPI && window.electronAPI.sendUrl) {
        window.electronAPI.sendUrl({
          url: url,
          username: usernameInput.value.trim(),
          password: passwordInput.value
        });
      }
    }

    window.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitUrl();
    });

    // Keyboard shortcut to wipe localStorage configuration variables out
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'r') {
        localStorage.clear();
        if (window.electronAPI && window.electronAPI.resetApp) {
          window.electronAPI.resetApp();
        }
      }
    });
  </script>
</body>
</html>
